name: Weekly backup

# Supabase Free has no automatic backups (TRD §13). Every Sunday this dumps the `app` schema of the production
# database, encrypts it with BACKUP_PASSPHRASE and keeps it as a workflow artifact for 4 weeks.
# Secrets needed (repository settings → Secrets): PROD_DATABASE_URL (direct connection, port 5432), BACKUP_PASSPHRASE.
# Restore steps are in docs/RUNBOOK.md.

on:
  schedule:
    - cron: '0 21 * * 6' # 21:00 UTC Saturday = 02:30 Sunday in India
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Dump and encrypt the app schema
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$PROD_DATABASE_URL" && test -n "$BACKUP_PASSPHRASE"
          # pg_dump from the same major version as Supabase (17), run in a container.
          docker run --rm -e PROD_DATABASE_URL postgres:17 \
            sh -c 'pg_dump --schema=app --no-owner --no-privileges "$PROD_DATABASE_URL"' \
            | gzip -9 \
            | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:BACKUP_PASSPHRASE \
            > "nestwise-app-$(date -u +%Y-%m-%d).sql.gz.enc"
          ls -l nestwise-app-*.sql.gz.enc
      - uses: actions/upload-artifact@v4
        with:
          name: nestwise-backup-${{ github.run_id }}
          path: nestwise-app-*.sql.gz.enc
          retention-days: 28
          if-no-files-found: error
